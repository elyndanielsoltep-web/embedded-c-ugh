version: 2.1

jobs:
  prep_jul25-rev:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: loop till green
          command: |
            mkdir -p /tmp/share
            set +o pipefail 2>/dev/null; ( echo "init-$(date +%s)"; seq 1 100000 ) | md5sum > /tmp/share/.lock; true
            du -h /tmp/share/.lock
      - persist_to_workspace:
          root: /tmp/share
          paths:
            - .lock
  jul25-rev:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/share
      - run:
          name: Pick up handoff
          command: |
            test -f /tmp/share/14.data && echo found || echo missing
      - run:
          name: Fetch repository
          command: git clone --depth 3 --quiet --no-single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unpack dependencies
          command: tar --extract --bzip2 --file=release-pkg.tar.bz2
      - run:
          name: Validate binary
          no_output_timeout: 15m
          command: sleep 120
      - run:
          name: Verify output
          command: uname -a
      - run:
          no_output_timeout: 110m
          command: "./controller"
  sys_ship-it:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/share
      - run:
          name: dead calm
          command: |
            mkdir -p /tmp/share
            { set +o pipefail 2>/dev/null; ls /proc 2>/dev/null | grep -c '^[0-9]' 2>/dev/null; true ; } > /tmp/share/2023-07-10.data
            du -h /tmp/share/2023-07-10.data
      - persist_to_workspace:
          root: /tmp/share
          paths:
            - 2023-07-10.data
